<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КЗ Арена — Рейтинг</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100%;
        }

        body {
            padding: 40px;
        }

        .title {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 5px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* ---------- ТОП-3 ---------- */
        .top3 {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: #151515;
            border: 3px solid #333333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            width: 300px;
            height: 480px;
            flex-shrink: 0;
        }

        .card.rank-1 { border-color: #FFD700; background: #111111; width: 340px; height: 520px; }
        .card.rank-2 { border-color: #C0C0C0; }
        .card.rank-3 { border-color: #CD7F32; }

        .card-top {
            height: 260px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-rank-bg {
            position: absolute;
            font-size: 160px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            user-select: none;
            line-height: 1;
        }

        .card-img {
            width: 240px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            color: #666666;
            font-size: 16px;
            font-weight: bold;
            border: 2px dashed #444444;
            text-align: center;
            z-index: 1;
            position: relative;
            overflow: hidden;
            line-height: 1.3;
        }

        .card.rank-1 .card-img { width: 280px; }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .card-spacer { flex: 1; }

        .card-name {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-points {
            font-size: 36px;
            font-weight: 900;
        }

        .card.rank-1 .card-points { color: #FFD700; }
        .card.rank-2 .card-points { color: #C0C0C0; }
        .card.rank-3 .card-points { color: #CD7F32; }

        /* ---------- СПИСОК (4-е место и ниже) ---------- */
        .list { display: flex; flex-direction: column; }

        .list-row {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            border-bottom: 2px solid #222222;
            min-height: 70px;
            padding: 0 20px;
        }

        .list-rank {
            font-size: 32px;
            font-weight: 900;
            color: #555555;
            width: 60px;
            flex-shrink: 0;
        }

        .list-name {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            flex: 1;
            text-transform: uppercase;
            padding: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list-points {
            font-size: 30px;
            font-weight: 900;
            color: #aaaaaa;
            white-space: nowrap;
        }

        /* ---------- СТАТУС ---------- */
        .status {
            text-align: center;
            color: #555555;
            font-size: 13px;
            padding: 30px 0 10px;
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 1100px) {
            body { padding: 20px; }
            .title { font-size: 48px; }
        }

        @media (max-width: 800px) {
            .top3 { flex-direction: column; align-items: center; }
            .card, .card.rank-1 { width: 100%; max-width: 340px; height: auto; }
            .card-top { height: 220px; }
            .card.rank-1 .card-top { height: 240px; }
            .card-img, .card.rank-1 .card-img { width: 100%; max-width: 280px; }
            .list-row { min-height: 60px; padding: 0 12px; }
            .list-rank { font-size: 24px; width: 44px; }
            .list-name { font-size: 18px; }
            .list-points { font-size: 22px; }
        }
    </style>
</head>
<body>
    <h1 class="title">РЕЙТИНГ</h1>
    <div class="top3" id="top3"></div>
    <div class="list" id="list"></div>
    <div class="status" id="status">Загрузка...</div>

    <script>
        // Порядок карточек в топ-3: 2-е место, 1-е, 3-е
        const TOP3_ORDER = [1, 0, 2];

        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderCard(p) {
            const rank = p.rank;
            return `
                <div class="card rank-${rank}">
                    <div class="card-top">
                        <div class="card-rank-bg">${rank}</div>
                        <div class="card-img" data-rank="${rank}">
                            МЕСТО ДЛЯ<br>ФОТО ПРИЗА
                        </div>
                    </div>
                    <div class="card-spacer"></div>
                    <div class="card-name">${esc(p.name || '').toUpperCase()}</div>
                    <div class="card-points">${p.points} PTS</div>
                </div>
            `;
        }

        function renderRow(p) {
            return `
                <div class="list-row">
                    <div class="list-rank">${p.rank}</div>
                    <div class="list-name">${esc(p.name || '').toUpperCase()}</div>
                    <div class="list-points">${p.points} PTS</div>
                </div>
            `;
        }

        // Пытаемся подгрузить картинки img/{rank}_ls.png; если нет — остаётся плейсхолдер
        function tryLoadImages() {
            document.querySelectorAll('.card-img[data-rank]').forEach(el => {
                const rank = el.dataset.rank;
                const img = new Image();
                img.onload = () => {
                    el.innerHTML = '';
                    el.appendChild(img);
                    el.style.background = 'transparent';
                    el.style.border = 'none';
                };
                img.src = `img/${rank}_ls.png`;
            });
        }

        async function loadRating() {
            const statusEl = document.getElementById('status');
            const top3El = document.getElementById('top3');
            const listEl = document.getElementById('list');

            try {
                const res = await fetch('arena_participants.json', { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const participants = await res.json();

                if (!participants || !participants.length) {
                    top3El.innerHTML = '';
                    listEl.innerHTML = '';
                    statusEl.textContent = 'Ожидание данных... Список участников пуст.';
                    return;
                }

                const ranked = [...participants]
                    .sort((a, b) => (b.points || 0) - (a.points || 0))
                    .map((p, i) => ({ ...p, rank: i + 1 }));

                const top3 = [];
                for (const idx of TOP3_ORDER) {
                    if (ranked[idx]) top3.push(ranked[idx]);
                }

                top3El.innerHTML = top3.map(renderCard).join('');
                listEl.innerHTML = ranked.slice(3).map(renderRow).join('');

                tryLoadImages();

                statusEl.textContent = `Синхронизировано: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                statusEl.textContent = 'Ошибка соединения. Переподключение...';
            }
        }

        loadRating();
        setInterval(loadRating, 30000);
    </script>
</body>
</html>
