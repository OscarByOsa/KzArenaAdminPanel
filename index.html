<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КЗ Арена — Рейтинг</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --muted: #888;
            --accent: #ff6600;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        #rating-container {
            width: 100%;
            max-width: 1000px;
        }
        .player-row {
            display: flex;
            align-items: center;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            transition: transform 0.1s ease;
        }
        .player-row:hover {
            transform: translateX(5px);
            border-color: var(--accent);
        }
        .rank {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--muted);
            width: 60px;
            flex-shrink: 0;
        }
        .rank.gold { color: var(--gold); }
        .rank.silver { color: var(--silver); }
        .rank.bronze { color: var(--bronze); }
        .name {
            flex-grow: 1;
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
        }
        .points {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
        }
        .pc-name {
            font-size: 0.8rem;
            color: var(--muted);
            margin-left: 15px;
        }
        #status {
            color: var(--muted);
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🏆 Рейтинг КЗ Арена</h1>
    <div id="rating-container"></div>
    <p id="status">Загрузка данных...</p>

    <script>
        async function loadRating() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('rating-container');
            
            // Путь к JSON-файлу в вашем репозитории GitHub Pages.
            // Замените <owner> и <repo> на ваши значения.
            const jsonUrl = 'arena_participants.json'; // Относительный путь работает, так как HTML и JSON в одном репозитории

            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                let participants = await response.json();

                if (!participants || participants.length === 0) {
                    statusEl.textContent = 'Пока нет участников.';
                    return;
                }

                // Сортировка по очкам (по убыванию)
                participants.sort((a, b) => b.points - a.points);

                container.innerHTML = ''; // Очищаем контейнер
                participants.forEach((p, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = 'gold';
                    else if (rank === 2) rankClass = 'silver';
                    else if (rank === 3) rankClass = 'bronze';

                    const row = document.createElement('div');
                    row.className = 'player-row';
                    row.innerHTML = `
                        <div class="rank ${rankClass}">${rank}</div>
                        <div class="name">${p.name}</div>
                        ${p.pc_name ? `<div class="pc-name">(${p.pc_name})</div>` : ''}
                        <div class="points">${p.points} PTS</div>
                    `;
                    container.appendChild(row);
                });
                statusEl.textContent = `Последнее обновление: ${new Date().toLocaleString()}`;

            } catch (error) {
                console.error('Ошибка загрузки рейтинга:', error);
                statusEl.textContent = 'Не удалось загрузить данные рейтинга.';
            }
        }

        // Загружаем рейтинг при открытии страницы
        loadRating();
        // И обновляем каждые 30 секунд (по желанию)
        setInterval(loadRating, 30000);
    </script>
</body>
</html>
